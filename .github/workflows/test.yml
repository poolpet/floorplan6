name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system deps for PyQt5
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libdbus-1-3

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest (without GUI tests)
        env:
          # Runnery GH nie mają serwera X — moduły testowe inne niż test_gui.py
          # też budują widgety Qt i bez offscreen padają na starcie QApplication.
          QT_QPA_PLATFORM: offscreen
        run: |
          PYTHONPATH=. pytest tests/ -v --tb=short \
            --ignore=tests/test_gui.py \
            -k "not regression"

      - name: Run regression tests (slow)
        if: matrix.python-version == '3.13'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          PYTHONPATH=. pytest tests/test_regression_lazienka.py -v --tb=short
